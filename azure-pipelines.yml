trigger:
- Dev

pool:
  vmImage: ubuntu-latest

stages:

- stage: Validate
  displayName: 'Build and Validate'
  jobs:
  - job: Validate
    displayName: 'Build and Bicep What-If'
    steps:

    - task: UseDotNet@2
      displayName: 'Install .NET 8 SDK'
      inputs:
        packageType: 'sdk'
        version: '8.x'

    - task: DotNetCoreCLI@2
      displayName: 'Restore'
      inputs:
        command: 'restore'
        projects: '**/*.sln'

    - task: DotNetCoreCLI@2
      displayName: 'Build'
      inputs:
        command: 'build'
        projects: '**/*.sln'
        arguments: '--configuration Release --no-restore'

    - task: AzureCLI@2
      displayName: 'Pre-deployment checks'
      inputs:
        azureSubscription: 'sc-cloudplatformlab-dev'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -euo pipefail

          echo "Checking Microsoft.Web registration..."

          state=$(az provider show \
            --namespace Microsoft.Web \
            --query registrationState \
            --output tsv)

          echo "Microsoft.Web registration state: $state"

          if [ "$state" != "Registered" ]; then
            echo "##vso[task.logissue type=error]Microsoft.Web is not registered."
            exit 1
          fi

          echo "Checking S1 App Service quota in UK South..."

          subscriptionId=$(az account show \
            --query id \
            --output tsv)

          quotaJson=$(az rest \
            --method get \
            --url "https://management.azure.com/subscriptions/${subscriptionId}/providers/Microsoft.Web/locations/uksouth/usages?api-version=2025-03-01")

          s1Limit=$(echo "$quotaJson" | jq -r \
            '.value[] | select(.name.value == "S1") | .limit')

          s1Usage=$(echo "$quotaJson" | jq -r \
            '.value[] | select(.name.value == "S1") | .currentValue')

          echo "S1 quota limit: $s1Limit"
          echo "S1 current usage: $s1Usage"

          if [ -z "$s1Limit" ]; then
            echo "##vso[task.logissue type=error]Unable to determine S1 App Service quota."
            exit 1
          fi

          if [ "$s1Limit" -lt 1 ]; then
            echo "##vso[task.logissue type=error]S1 App Service quota in UK South is 0. Deployment cannot continue."
            exit 1
          fi

          echo "Pre-deployment checks passed."

    - task: AzureCLI@2
      displayName: 'Bicep What-If'
      inputs:
        azureSubscription: 'sc-cloudplatformlab-dev'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az deployment group what-if \
            --resource-group rg-cloudplatformlab-dev \
            --template-file infra/appservice/main.bicep

- stage: DeployDev
  displayName: 'Deploy Dev Infrastructure'
  dependsOn: Validate
  condition: succeeded()

  jobs:
  - deployment: DeployDevInfrastructure
    displayName: 'Deploy Bicep to Dev'
    environment: 'env-cloudplatformlab-dev'

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - task: AzureCLI@2
            displayName: 'Deploy Bicep'
            inputs:
              azureSubscription: 'sc-cloudplatformlab-dev'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az deployment group create \
                  --resource-group rg-cloudplatformlab-dev \
                  --template-file infra/appservice/main.bicep \
                  --name cloudplatformlab-dev